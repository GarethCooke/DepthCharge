; firmware/platformio.ini — DepthCharge on the ESP32-S3 (M3 stage C).
;
; FRAMEWORK: Arduino, on espressif32 6.5.0. This is not a preference — it is what
; M2's first-light sketch used, which the M3 brief says to reuse, and it was
; established by inspection rather than memory: ~/.platformio/packages holds
; framework-arduinoespressif32 (3.20014.231204 = Arduino-ESP32 2.0.14) and does
; NOT hold framework-espidf, so the bench has only ever built Arduino. Staying
; here also keeps stage D's HUB75 library on the stack M2 proved.
;
; The cost is the language ceiling recorded in ARCHITECTURE §9: this platform
; pins xtensa GCC 8.4, which does not accept -std=c++20 and whose libstdc++ has
; no <span>/<ranges>/<concepts>/<bit>. engine/ is already written to that subset
; and dc_engine_target_check enforces it on every host build, so linking it here
; is a link and not a port — which is the whole bet of invariant #1.
;
; BOARD: the stock esp32-s3-devkitc-1 definition is the N8 variant (8 MB flash,
; no PSRAM). The bench DevKit is an ESP32-S3-WROOM-1 **N16R8** (hardware/
; BRINGUP.md), so flash size, partition table and the octal-PSRAM memory type
; are all overridden below. See firmware/README.md if the board fails to boot:
; stage C needs no PSRAM at all, so the two PSRAM lines are the first thing to
; comment out when bisecting.

[platformio]
; A bare `pio run` (or `pio run -t upload`) builds — and flashes — EVERY
; environment in this file in sequence, and the last one wins. That is how a
; depthcharge-ps (power-save ON) image can end up on the board unlabelled.
; Name the daily driver; every other env is asked for explicitly with -e.
default_envs = depthcharge

[env]
platform  = espressif32@6.5.0
board     = esp32-s3-devkitc-1
framework = arduino

; --- THE FRAMEWORK IS A LOCAL REBUILD, AND IT IS LOAD-BEARING ----------------
; Every environment in this file builds against a LOCAL copy of the Arduino
; framework package with exactly one archive rebuilt: liblwip.a from the same
; source (esp-idf tag v4.4.6, the commit the package's versions.txt names) and
; the same toolchain generation, changing ONE Kconfig value:
;
;   CONFIG_LWIP_TCP_WND_DEFAULT   5744 -> 17232   (12 x MSS 1436)
;
; WHY IT IS HERE AND NOT IN AN ARM. It shipped as `[env:depthcharge-wnd]` on
; 2026-08-14 because its acceptance run "moved nothing" — 44 KiB/s before and
; after. That verdict was wrong, and a day of data says so (ARCHITECTURE §9,
; 2026-08-16): the 23.6-hour soak on this archive ran 56-87 KiB/s at every hour
; of the day, and the stock 5,744-byte window across the measured 87 ms
; transatlantic RTT is a HARD 65.5 KiB/s cap that most of those hours sit above.
; The evening that convicted it was congestion, not the window. So the rebuild
; is the build, and the arm is gone: an experiment nobody can lose track of is
; better than two envs one of which is quietly the real one.
;
; It is in [env] rather than on [env:depthcharge] deliberately. Every other
; environment here exists to be compared against the daily driver, and an arm
; that differs in the framework as well as in its one flag is not a controlled
; arm. link-autopsy in particular measures raw stack throughput, which is the
; one number the window changes.
;
; CONFIG_LWIP_TCP_RECVMBOX_SIZE stays at the stock 6 BY MEASUREMENT, not
; oversight: 14 (Kconfig's own WND/MSS + 2 guidance) beside this 17232 window
; left the board unable to complete a single WebSocket upgrade — TLS handshake
; fine, HTTP 101 never arrives — and even beside the stock 5744 window it
; connected only to watchdog-grey within 25 s. The full 2x2 is in the README
; below; mechanism not understood; do not raise it without a soak behind it.
;
; The swap is ABI-safe at this vintage (every TCP_WND use compiles into
; liblwip.a; WND_SCALE stays off so tcp_pcb layout is unchanged) and verified:
; symbol tables identical (564 globals), and tcp_alloc's rcv_wnd literal pair
; reads 0x4350 (17232) where the stock archive reads 0x1670 (5744). Provenance,
; verification, the rebuild scripts and the do-not-exceed-65535 caveat:
;   C:\local\framework-arduinoespressif32-wnd17232\WND17232-README.md
;
; ON A MACHINE THAT DOES NOT HAVE THE PACKAGE, every environment in this file
; fails to resolve — which is a real cost of promoting this out of an arm, so
; here is the recovery rather than just the rationale. Two options:
;
;   1. Rebuild it. The README above carries the full pipeline and the scripts;
;      it was built in WSL Ubuntu (Docker Desktop is dead on this desk) from the
;      esp-idf v4.4.6 tag with one Kconfig value changed. Half an evening.
;   2. Comment out the two lines below and accept stock. The firmware is
;      correct either way — it simply cannot pull more than 65.5 KiB/s from
;      Anvil across the 87 ms transatlantic RTT, so the panel runs further
;      behind at peak and says so honestly. Nothing else changes.
;
; What must NOT happen is a silent third option: pointing this at a package
; whose provenance nobody can state. The whole reason the local copy has a
; README with symbol-table diffs in it is that "the framework, but patched" is
; otherwise unfalsifiable.
platform_packages =
  framework-arduinoespressif32 @ symlink://C:/local/framework-arduinoespressif32-wnd17232

; --- N16R8: 16 MB QIO flash + 8 MB octal PSRAM -------------------------------
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.partitions          = default_16MB.csv
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216

; --- the panel (M3 stage D) --------------------------------------------------
; The HUB75 DMA driver M2 lit the panel with, pinned to an exact version for the
; same reason everything else here is: this stack has decided five designs
; already (esp_crt_bundle, heap_trace_start, reconnect_timeout_ms,
; CONFIG_FREERTOS_GENERATE_RUN_TIME_STATS, the blocking stop()), and a floating
; dependency is one more thing that can change under a bench run.
;
; It pulls Adafruit GFX transitively. DepthCharge uses almost none of it: the
; ladder is drawn with drawPixel/drawFastHLine/fillRect and its own 3x5 font
; (ladder_font.hpp), because a font whose metrics we own is a font the host test
; can prove the 64-row budget against. GFX is present because the library's base
; class wants it, not because the renderer does.
lib_deps =
  mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@3.0.15

; engine/ is compiled from where it lives — never copied, never vendored. The
; header path plus exactly one .cpp is the entire "link engine/ as-is" story.
;
; Naming the parser here is deliberate, and mirrors the host build where every
; executable names either dc_engine_anvil or dc_engine_anvil_streaming. The
; nlohmann reference is NOT listed and must never be: it allocates per parse
; (invariant #7) and needs a vendored JSON library that has no business on the
; target. If a second implementation of the seam ever appears, this line is
; where the firmware chooses.
build_src_filter =
  +<*>
  +<../../engine/src/anvil/anvil_frame_streaming.cpp>

build_flags =
  ; engine/ lives outside this project directory; it is included, never copied.
  -I ../engine/include
  -D BOARD_HAS_PSRAM
  ; MAKING THE FIRMWARE AUDIBLE. Stage C's entire evidence is the serial log, and
  ; getting it out takes THREE things — verified by grepping the built .elf for
  ; the log strings, because two of them looked sufficient and were not:
  ;
  ;   1. LOG_LOCAL_LEVEL=3 (ESP_LOG_INFO). esp_log.h defaults this to
  ;      CONFIG_LOG_MAXIMUM_LEVEL, which the precompiled framework ships as 1
  ;      (ERROR), so ESP_LOGI/ESP_LOGW compile to nothing. CORE_DEBUG_LEVEL does
  ;      NOT fix it: that only feeds Arduino's esp32-hal-log.h, which a TU
  ;      including <esp_log.h> directly never sees. Defining it on the command
  ;      line is what makes it unconditional. Numeric rather than the enum name
  ;      because the macro must survive being defined before esp_log.h exists.
  ;   2. CORE_DEBUG_LEVEL=3, for the Arduino core's own log_i/log_e — chatty, and
  ;      wanted while bringing up an association and a TLS handshake for the
  ;      first time.
  ;   3. esp_log_level_set("*", ESP_LOG_INFO) at runtime in setup(), because
  ;      CONFIG_LOG_DEFAULT_LEVEL is 1 as well and esp_log_write filters on it.
  ;
  ; Miss any one and the board looks dead on the monitor while working perfectly.
  -D LOG_LOCAL_LEVEL=3
  -D CORE_DEBUG_LEVEL=3
  ; The engine is C++20-shaped (designated initialisers, if-with-initialiser,
  ; constexpr string_view). GCC 8.4 spells the standard c++2a; c++20 is rejected
  ; outright, which is exactly what dc_engine_target_check compiles against.
  -std=gnu++2a
  ; --- the panel (M3 stage D) -------------------------------------------------
  ; NO_GFX drops the HUB75 library's Adafruit_GFX base class, and it is doing
  ; two jobs. It removes a dependency (Adafruit GFX + BusIO) for a text path this
  ; firmware does not use — ladder_font.hpp owns the font, because the 64-row
  ; budget has to be provable in ctest rather than discovered on the panel. And
  ; it removes print()/setTextColor(), which is what makes invariant #5's single
  ; palette selection STRUCTURAL: with no GFX there is no way to put anything on
  ; this panel without naming an Ink, and ladder_render.hpp cannot name a colour.
  ; What NO_GFX leaves is exactly what the renderer uses: drawPixelRGB888, the
  ; RGB888 drawFastHLine, fillScreenRGB888, flipDMABuffer, setBrightness.
  -D NO_GFX
  ; --- the pixel clock, and the one lever left on the ghosting -----------------
  ; THE PANEL HAS NEVER RUN AT THE SPEED THE CONFIG ASKS FOR. On the S3 the
  ; library buckets i2sspeed rather than using it
  ; (gdma_lcd_parallel16.cpp:140-147): anything <= 10 MHz lands on divider 16,
  ; i.e. 160/16 = 10 MHz, while the refresh-rate loop still computes from the
  ; 8 MHz we asked for. The board says so itself -- `Clock divider is 16` beside
  ; `refresh=105 Hz`, when the real figure was ~131 Hz.
  ;
  ; S3_LCD_DIV_NUM is the library's own compile-time override, checked
  ; immediately after that bucket, and it is the only way to actually slow the
  ; clock. 24 gives 160/24 = 6.67 MHz -- a THIRD off the edge rate, which is the
  ; quantity both open panel problems turn on:
  ;
  ;   * ghosting beside the header glyphs wants more setup/hold margin at the
  ;     shift register, and slower edges give it without inverting CLK (which
  ;     the 2026-08-11 bench convicted of starving the feed on the OLD client;
  ;     2026-08-14 re-tested on the owned client, no collapse, and clkphase is
  ;     now false -- see panel.cpp for both verdicts);
  ;   * the coupling into the 2.4 GHz radio is a di/dt problem, and slower edges
  ;     reduce di/dt directly.
  ;
  ; Cost is refresh: ~131 Hz -> ~87 Hz. Still comfortably clear of visible
  ; flicker and of DESIGN strain 15's margin (one scan inside one 33 ms render
  ; period). If 24 is not enough, 32 gives 5 MHz and ~65 Hz, which is the floor
  ; worth trying; if it makes no difference to either symptom, delete this line
  ; rather than leaving a slower panel for nothing.
  -D S3_LCD_DIV_NUM=24
build_unflags =
  -std=gnu++11
  -std=gnu++17

; The bench has two USB-serial bridges enumerated at once — a CP210x on COM3 and
; the DevKit's CH343 (VID:PID 1A86:55D3) on COM5 — so auto-detect picks the wrong
; one. Named explicitly rather than left to guess; re-check with `pio device list`
; if Windows renumbers the port.
upload_port     = COM7
monitor_port    = COM7

monitor_speed   = 115200
; `log2file` is here rather than passed as `pio device monitor -f log2file` for two
; reasons, both learned the hard way. First, `pio run` has NO `-f` option, so the
; one-line `run -t upload -t monitor -f log2file` that everyone reaches for fails
; outright. Second, a CLI `-f` risks losing `time` — and the timestamp on every
; line is not decoration: socket-drop intervals and stopwatch pairings are read off
; it, and the M3 log has twice recorded losing a run's cumulative totals to a
; truncated monitor buffer with no timestamps to reconstruct from.
;
; Writes to `logs/device-monitor-<ts>.log` RELATIVE TO THE WORKING DIRECTORY, so
; run pio from `firmware/` and it lands in `firmware/logs/`, which is gitignored.
monitor_filters = esp32_exception_decoder, time, log2file
upload_speed    = 921600

; --- the builds ---------------------------------------------------------------
; Everything above is shared. `depthcharge` is the object; the rest are arms of
; an experiment, and they exist as environments rather than as an
; edit-and-reflash because an arm that requires remembering to change a line
; back is an arm that eventually gets mislabelled.
;
; The old client's two arms — `depthcharge-espws` (esp_websocket_client, two
; handles, the 5 s sleeper) and `depthcharge-nopp` (its ping/pong machinery off)
; — are GONE, with the DC_OWNED_WS and DC_WS_PINGPONG switches and every #if arm
; behind them. The acceptance they were the control for has passed: the 23.6 h
; soak on `device-monitor-260815-002728.log` records connects=1 over a 10.9 h
; segment, zero errno-silent deaths, zero SPLIT@ rejects and parse=0, against
; the library's baseline of a death every 6-10 minutes and 85 framing rejects in
; four hours. Their archaeology is in ARCHITECTURE §9 (2026-08-09, 2026-08-10,
; 2026-08-13) and in this file's history; nothing is left in the tree that could
; still build them, which is the point.
;
;   pio run -e depthcharge     -t upload     the object: modem sleep OFF
;   pio run -e depthcharge-ps  -t upload     contrast: modem sleep at the
;                                            Arduino default (WIFI_PS_MIN_MODEM)
;
; Whichever is running says so in one line at association — read back out of the
; driver with esp_wifi_get_ps(), not echoed from what we asked for.
[env:depthcharge]

[env:depthcharge-ps]
build_flags =
  ${env.build_flags}
  -D DC_WIFI_POWER_SAVE=1

; --- the pingless control arm ------------------------------------------------
; THE ARM INVERTED ON 2026-08-16 (backlog D5), and it is worth reading why
; rather than assuming the flag simply moved.
;
; This used to be `depthcharge-ping`, a 60 s client ping, off by default, kept
; only until the owner deleted it. Its question — can a ping PROVOKE a half-open
; socket into an error the socket will report — is closed and stays closed: the
; supervisor acts on the silence directly (kSilenceRecycleUs), which needs no
; server cooperation and no write into a fade.
;
; The ping came back for a different question, so it is on by default now. It
; measures the round-trip, and because Anvil's vendored Crow queues a pong behind
; everything already posted to this connection, that round-trip PRICES THIS
; SOCKET'S SERVER-SIDE SEND QUEUE. That is the term the age estimator cannot
; separate: age high with a fast pong is lag upstream in the broadcaster, age
; high with a slow pong is our own undrained queue. Argument, bounds and the
; things a fast pong does NOT prove are in `ws_ping.hpp`; the policy is
; host-tested in `harness/tests/test_ws_ping.cpp`.
;
; This arm exists so a bench session can still attribute a change to the ping and
; to nothing else — the same reason `depthcharge-ps` exists. It also builds the
; only firmware in which `last_data_us` and byte-arrival are the same quantity,
; which is the one thing turning the ping on changed underneath the silence
; recycle (see ws_transport.hpp).
[env:depthcharge-noping]
build_flags =
  ${env.build_flags}
  -D DC_WS_PING=0

; --- the Kraken venue (M4 stage D, A3) ---------------------------------------
; ONE VENUE PER BUILD, and this is the other one. The switch is `DC_VENUE`
; (firmware/src/venue_build.hpp), which selects the adapter type, the endpoint,
; the root CA, the subscribed symbol and depth, and which counter counts the
; venue's liveness signal. The default stays Anvil, deliberately: a bare
; `pio run` builds the image M3's 23.6 h soak was run on.
;
; `2` rather than `DC_VENUE_KRAKEN`, because the names are defined in the header
; the flag is read by, which the command line necessarily precedes. A wrong
; number is not silent — venue_build.hpp `#error`s on anything but 1 or 2.
;
; THE PARSER TU IS SWAPPED, NOT ADDED. `build_src_filter` is replaced rather than
; extended so the Anvil streaming parser is not compiled into a build that can
; never call it: it is ~5.9 KiB of .text, and more to the point a Kraken image
; carrying Anvil's parser is an image whose flash figure cannot be compared with
; anything. The engine has one parser per venue and this line is where the
; firmware chooses (see the [env] filter's own note).
;
; WHAT THE BENCH GETS THAT THE ANVIL BUILD DOES NOT: a venue that publishes a
; CRC32 over the top ten levels a side, so `-- crc` is a real ledger and the
; `SOAK` line's `crc_rows` is a real number rather than an honest zero; and the
; healing path (A2), which is the only reason this firmware has ever sent a frame
; the server did not ask for.
;
;   pio run -e depthcharge-kraken -t upload -t monitor
[env:depthcharge-kraken]
build_src_filter =
  +<*>
  +<../../engine/src/kraken/kraken_frame_streaming.cpp>
build_flags =
  ${env.build_flags}
  -D DC_VENUE=2

; --- the Binance venue (M5 stage D-A1) ---------------------------------------
; THE THIRD VENUE, and the same shape as the second: one venue per build, the
; parser TU SWAPPED rather than added, `3` rather than `DC_VENUE_BINANCE`
; because the names are defined in the header the flag is read by, which the
; command line necessarily precedes. A wrong number is not silent —
; venue_build.hpp `#error`s on anything but 1, 2 or 3.
;
; WHAT THIS BUILD DOES NOT HAVE YET, stated because a bench evening will
; otherwise read it as a fault. There is no REST client in D-A1, so nothing
; ever fetches the seed; the adapter therefore never baselines, remedy (a)
; withholds the Snapshot, and **the ladder is honestly GREY with
; `seeds_unconfirmed` counting.** That is the acceptance, not a defect — it is
; the first time invariant #5's forbidden output has been PREVENTED on a panel
; rather than in a test. The seed, the re-seed and the colour are D-A2 and D-B.
;
; NO SUBSCRIPTION FRAME. Binance names the stream in the URL path, so this venue
; sits where Anvil does: `kHasSubscription` is false and
; `DC_VENUE_HAS_SUBSCRIPTION` resolves to 0, so none of Kraken's subscribe /
; resync path is compiled in.
;
; TWO HOSTS, ONE TLS ANCHOR — measured off both live servers on 2026-08-27 and
; recorded in binance_root_ca.hpp. `*.binance.vision` is a wildcard leaf served
; identically by the stream host and the REST host, so D-A2 needs no second PEM.
;
;   pio run -e depthcharge-binance -t upload -t monitor
[env:depthcharge-binance]
build_src_filter =
  +<*>
  +<../../engine/src/binance/binance_frame_streaming.cpp>
build_flags =
  ${env.build_flags}
  -D DC_VENUE=3

; --- the silent-stream arm (M5 stage D-B, question 1) ------------------------
; D-B has to decide what a feed that NEVER SPEAKS should render, and the case is
; stageable from the wire rather than from a test-only flag: a misspelled stream
; name returns HTTP 101, answers pings and delivers nothing for ever. B1
; captured exactly that as `binance_btcusdt_DEFECT_silent_stream_20260826.ndjson`
; and M4 had to invent `DC_TEST_MUTE_LIVENESS` for the equivalent case because
; both network-side methods deauthenticated. Nothing like that is needed here —
; the venue stages it for us, with no test-only code in the shipping image.
;
; ONE CHARACTER, and it is the committed capture's exact spelling: `@depth@100mss`
; with the trailing `s`. `binance_endpoint.hpp` does not merely skip its
; path assertion on this arm, it INVERTS it — the defect build asserts the path
; IS the known-defective one, because a different misspelling would be a
; different experiment and might not be silent at all.
;
; THE BOARD SAYS SO ON EVERY SOAK LINE, not just at boot, because this image is
; indistinguishable from a broken board by design and a capture of it would look
; exactly like a fault to anyone who did not know which image was flashed — and
; `capture_noreset.py` attaches WITHOUT resetting, so a boot-only banner is
; invisible to every capture that matters. Same mechanism as `DC_SOAK_TEST_TAG`,
; and the string is absent from the other seven binaries rather than merely
; unprinted (verified with `strings`).
;
; FLASH IT LAST. It leaves a board that never goes live, so the working image
; wants re-flashing before anything else is judged.
;
;   pio run -e depthcharge-binance-silent -t upload -t monitor
; DERIVED FROM `depthcharge-binance` RATHER THAN COPIED, and that is the only
; structural decision in this block. This arm is not a fourth venue sitting
; beside the other three — it is the Binance build PLUS ONE FLAG, and it has to
; stay that or it stops being a controlled experiment. A copied `build_flags`
; and `build_src_filter` would silently stop matching the moment the Binance env
; gained anything, and the divergence would still COMPILE: the same
; stale-rationale failure ARCHITECTURE §9 already carries a row for. `extends`
; makes "the same, plus one define" a fact the build system enforces.
;
; The `${env:...}` reference is required: a child's `build_flags` REPLACES the
; inherited value rather than appending to it, so naming the parent's flags is
; what keeps `-D DC_VENUE=3` and the base flags. `build_src_filter` is
; inherited untouched, which is the half most likely to drift — it names the
; parser TU.
[env:depthcharge-binance-silent]
extends = env:depthcharge-binance
build_flags =
  ${env:depthcharge-binance.build_flags}
  -D DC_BINANCE_SILENT_STREAM=1

; --- the link diagnostic -----------------------------------------------------
; diag/wifi_diag.cpp and nothing else: no engine, no panel, no websocket. Built
; for the 2026-08-13 drop storm (a reconnect every ~7 s at rssi −78…−80) to
; answer what the main firmware cannot: WHICH mesh node the board is on versus
; which are visible, and the STA disconnect reason codes. See the file's header
; for the serial commands and how to read the output.
;
;   pio run -e wifi-diag -t upload && pio device monitor -e wifi-diag
[env:wifi-diag]
build_src_filter =
  -<*>
  +<../diag/wifi_diag.cpp>
lib_deps =

; diag/link_autopsy.cpp: owns the socket (esp-tls + a hand-rolled WS client) so
; that every flow death yields the exact mbedtls rc / errno / SO_ERROR / close
; frame that esp_websocket_client swallowed — the sketch this firmware's own
; client was grown from. Three switchable flows (Anvil WS, unrelated TLS bulk,
; plain-TCP bulk) split in-path vs server vs TLS-only causes, which is how the
; 2026-08-14 evening measured raw tcp-bulk at 213 KB/s while the production
; firmware sat at 44.
;
; It builds on the same rebuilt framework as everything else here (see [env]),
; which is what folded the old `link-autopsy-wnd` arm away: a throughput
; discriminator that ran on a different lwIP from the firmware it is
; discriminating for was answering a question nobody asked.
;
;   pio run -e link-autopsy -t upload && pio device monitor -e link-autopsy
[env:link-autopsy]
build_src_filter =
  -<*>
  +<../diag/link_autopsy.cpp>
lib_deps =
